<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Helpmate | Response Teams</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-900 text-white flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-black min-h-screen p-6">
  <h1 class="text-red-600 text-2xl font-bold mb-8">🚨 Helpmate</h1>
  <nav class="space-y-4">
    <a href="dashboard.html" class="block hover:text-red-400">Dashboard</a>
    <a href="reports.html" class="block hover:text-red-400">Reports</a>
    <a href="analytics.html" class="block hover:text-red-400">Analytics</a>
    <a href="volunteers.html" class="block text-red-500 font-semibold">Response Teams</a>
  </nav>
</aside>

<!-- MAIN -->
<main class="flex-1 p-8">

  <h2 class="text-3xl font-bold mb-6">👥 Response Teams</h2>

  <!-- Team Cards -->
  <div class="grid grid-cols-3 gap-6">

    <!-- Team Card -->
    <div class="bg-zinc-800 p-6 rounded-xl">
      <h3 class="text-xl font-semibold">Medical Team</h3>
      <p class="text-zinc-400 mt-2">Active Cases: 5</p>
      <span class="inline-block mt-4 px-3 py-1 bg-green-600 rounded-full text-sm">Available</span>
    </div>

    <div class="bg-zinc-800 p-6 rounded-xl">
      <h3 class="text-xl font-semibold">Fire Response Unit</h3>
      <p class="text-zinc-400 mt-2">Active Cases: 3</p>
      <span class="inline-block mt-4 px-3 py-1 bg-yellow-600 rounded-full text-sm">Busy</span>
    </div>

    <div class="bg-zinc-800 p-6 rounded-xl">
      <h3 class="text-xl font-semibold">Crime Support Team</h3>
      <p class="text-zinc-400 mt-2">Active Cases: 7</p>
      <span class="inline-block mt-4 px-3 py-1 bg-red-600 rounded-full text-sm">Overloaded</span>
    </div>

    <div class="bg-zinc-800 p-6 rounded-xl">
      <h3 class="text-xl font-semibold">Public Services Team</h3>
      <p class="text-zinc-400 mt-2">Active Cases: 4</p>
      <span class="inline-block mt-4 px-3 py-1 bg-green-600 rounded-full text-sm">Available</span>
    </div>

  </div>

</main>
<script src="responseTeams.js"></script>

  updateResponseTeams();
</script>
