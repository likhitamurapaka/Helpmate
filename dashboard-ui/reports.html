<!DOCTYPE html>
<html>

<head>
  <title>Helpmate | Live Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-900 text-white flex">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-black min-h-screen p-6">
    <h1 class="text-red-600 text-2xl font-bold mb-8">🚨 Helpmate</h1>
    <nav class="space-y-4">
      <a href="index.html" class="block hover:text-red-400">Dashboard</a>
      <a href="reports.html" class="block text-red-500 font-semibold">Reports</a>
      <a href="analytics.html" class="block hover:text-red-400">Analytics</a>
      <a href="volunteers.html" class="block hover:text-red-400">Response Teams</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-8">
    <h2 class="text-3xl font-bold mb-6">📋 Live Emergency Reports</h2>

    <!-- KPI Counters -->
    <div class="flex gap-6 mb-6">
      <div>Total: <span id="totalCount">0</span></div>
      <div>Pending: <span id="pendingCount">0</span></div>
      <div>In Progress: <span id="progressCount">0</span></div>
      <div>Resolved: <span id="resolvedCount">0</span></div>
    </div>

    <!-- POPUP ALERT -->
    <div id="alertPopup" class="hidden bg-red-700 p-4 rounded mb-6">
      <span id="alertText"></span>
    </div>

    <!-- ===== Reports Container ===== -->
    <div id="reportsContainer" class="space-y-4">
      <!-- JS will dynamically fill this with report cards -->
    </div>
  </main>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- AI SERVICE -->
  <script src="ai_service.js"></script>

  <!-- DASHBOARD SCRIPT -->
  <script src="reports.js"></script>

</body>

</html>
