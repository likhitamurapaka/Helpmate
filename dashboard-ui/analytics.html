<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Helpmate | Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-zinc-900 text-white flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-black min-h-screen p-6">
  <h1 class="text-red-600 text-2xl font-bold mb-8">🚨 Helpmate</h1>
  <nav class="space-y-4">
    <a href="index.html" class="block hover:text-red-400">Dashboard</a>
    <a href="reports.html" class="block hover:text-red-400">Reports</a>
    <a href="analytics.html" class="block text-red-500 font-semibold">Analytics</a>
    <a href="volunteers.html" class="block hover:text-red-400">Response Teams</a>
  </nav>
</aside>

<!-- MAIN -->
<main class="flex-1 p-8">

  <h2 class="text-3xl font-bold mb-6">📊 Analytics & Insights</h2>

  <!-- Charts Grid -->
  <div class="grid grid-cols-2 gap-8">

    <!-- Issues per Day -->
    <div class="bg-zinc-800 p-6 rounded-xl">
      <h3 class="mb-4 font-semibold">Issues Reported (Last 7 Days)</h3>
      <canvas id="dailyChart"></canvas>
    </div>

    <!-- Resolution Rate -->
    <div class="bg-zinc-800 p-6 rounded-xl">
      <h3 class="mb-4 font-semibold">Resolution Status</h3>
      <canvas id="resolutionChart"></canvas>
    </div>

    <!-- Category Distribution -->
    <div class="bg-zinc-800 p-6 rounded-xl col-span-2">
      <h3 class="mb-4 font-semibold">Emergency Category Distribution</h3>
      <canvas id="categoryChart"></canvas>
    </div>

  </div>

</main>

<script>
/* Issues per day */
new Chart(dailyChart, {
  type: "line",
  data: {
    labels: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
    datasets: [{
      label: "Issues",
      data: [12, 19, 15, 22, 30, 18, 25],
      borderColor: "#dc2626",
      backgroundColor: "rgba(220,38,38,0.2)",
      tension: 0.4,
      fill: true
    }]
  }
});

/* Resolution chart */
new Chart(resolutionChart, {
  type: "doughnut",
  data: {
    labels: ["Resolved", "In Progress", "Pending"],
    datasets: [{
      data: [65, 20, 15],
      backgroundColor: ["#22c55e", "#3b82f6", "#f59e0b"]
    }]
  }
});

/* Category distribution */
new Chart(categoryChart, {
  type: "bar",
  data: {
    labels: ["Medical", "Fire", "Crime", "Public"],
    datasets: [{
      data: [40, 25, 30, 29],
      backgroundColor: ["#ef4444","#f97316","#3b82f6","#22c55e"],
      borderRadius: 6
    }]
  },
  options: {
    plugins: { legend: { display: false } }
  }
});
</script>

</body>
</html>
